# This file is no longer used.
#
# The bot previously used camply with this config, but camply's GoingToCamp
# provider doesn't support the "Backcountry Zone" resource category
# (ID -2147483632) used by Lake O'Hara Backcountry. Every run returned
# "0 Matching Campgrounds Found" because the campground was silently
# filtered out.
#
# The bot now uses check_availability.py which queries the Parks Canada
# GoingToCamp API directly. Configuration is in the GitHub Actions workflow
# file: .github/workflows/check-availability.yml
#
# Kept for reference:
#
# provider: GoingToCamp
# recreation_area: 14                       # Parks Canada (reservation.pc.gc.ca)
# campgrounds: -2147483538                  # Lake O'Hara Backcountry
# start_date: "2026-06-19"
# end_date: "2026-10-03"
# nights: 2
# days:
#   - Friday
#   - Saturday
#   - Sunday
# notifications: email
# search_once: true
# offline_search: true
# offline_search_path: camply_campsites.json
# notify_first_try: true
