name: Daily Status Email

# PAUSED along with the availability checker — no daily status email while the
# bot is not polling. Uncomment the `schedule` block to resume.

on:
  # schedule:
  #   # 14:00 UTC = 7am MST / 8am MDT
  #   - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  send-status:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Send daily status email
        env:
          FIRST_NIGHT: "2026-09-15"
          LAST_NIGHT: "2026-10-03"
          MIN_NIGHTS: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EMAIL_TO_ADDRESS: ${{ secrets.EMAIL_TO_ADDRESS }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_SMTP_SERVER: smtp.gmail.com
          EMAIL_SMTP_PORT: "465"
          EMAIL_FROM_ADDRESS: ${{ secrets.EMAIL_USERNAME }}
        run: python send_status.py
