name: Check Lake O'Hara Availability

on:
  schedule:
    # Run every 10 minutes
    - cron: "*/10 * * * *"
  workflow_dispatch:
    # Adds a "Run workflow" button in the GitHub Actions UI for manual testing

permissions:
  contents: write # Required to commit the offline search state file

jobs:
  check-campsites:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check for cancellations
        env:
          EMAIL_TO_ADDRESS: ${{ secrets.EMAIL_TO_ADDRESS }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_SMTP_SERVER: smtp.gmail.com
          EMAIL_SMTP_PORT: "465"
          EMAIL_FROM_ADDRESS: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_SUBJECT_LINE: "Lake O'Hara Backcountry - Campsite Available!"
        run: |
          camply campsites \
            --yaml-config search_config.yaml

      - name: Save search state
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update camply offline search state"
          file_pattern: "camply_campsites.json"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
