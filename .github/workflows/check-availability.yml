name: Check Lake O'Hara Availability

# GitHub's scheduler is unreliable and cannot be relied on for frequency. A
# "*/10" cron on this repo actually fired about every 4 hours, and an hourly
# cron was observed skipping three consecutive hours entirely. So the cron is
# treated purely as a way to (re)start a run, never as the polling interval.
#
# Each run polls in-process for just under GitHub's 6-hour job limit, and the
# concurrency group serialises runs: while one is running the next is queued
# and starts the moment the current one ends. Coverage therefore stays
# continuous as long as the schedule fires at least once every ~6 hours, which
# is well inside the worst gap observed.
#
# The cron deliberately avoids minute 0. The top of the hour is the most
# congested slot on GitHub's scheduler and the most likely to be dropped.
#
# This costs ~24 runner-hours/day, which is free on a public repo and would
# blow through the free tier on a private one.

# PAUSED. The 2026 season is over for us, so the schedule below is commented
# out and the bot no longer polls on its own. Everything still works — uncomment
# the two `schedule` lines to start it again, and update FIRST_NIGHT/LAST_NIGHT
# for the new season (see "Waking it back up" in the README).
#
# Until then the workflow only runs when started by hand from the Actions tab.

on:
  # schedule:
  #   - cron: "9,29,49 * * * *"
  workflow_dispatch:
    inputs:
      poll_duration_minutes:
        description: "How long this run should poll for"
        required: false
        default: "350"

permissions:
  contents: write

concurrency:
  group: lake-ohara-check
  cancel-in-progress: false

jobs:
  check-campsites:
    runs-on: ubuntu-latest
    timeout-minutes: 358

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check for cancellations
        env:
          FIRST_NIGHT: "2026-09-15"
          LAST_NIGHT: "2026-10-03"
          MIN_NIGHTS: "1"
          ALLOWED_DAYS: "Monday,Tuesday,Wednesday,Thursday,Friday,Saturday,Sunday"
          STATE_FILE: "availability_state.json"
          ALERT_COOLDOWN_HOURS: "12"
          POLL_DURATION_MINUTES: ${{ github.event.inputs.poll_duration_minutes || '350' }}
          POLL_INTERVAL_SECONDS: "30"
          EMAIL_TO_ADDRESS: ${{ secrets.EMAIL_TO_ADDRESS }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_SMTP_SERVER: smtp.gmail.com
          EMAIL_SMTP_PORT: "465"
          EMAIL_FROM_ADDRESS: ${{ secrets.EMAIL_USERNAME }}
        run: python check_availability.py

      - name: Save alert state
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "Update Lake O'Hara alert state"
          file_pattern: "availability_state.json"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
